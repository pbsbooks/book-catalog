<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Book Library</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #f8f9fa; 
            color: #212529;
            margin: 0; 
            padding: 20px; 
        }
        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            text-align: center;
        }
        h1 { margin-bottom: 15px; }
        .search-box {
            width: 100%;
            max-width: 500px;
            padding: 12px 18px;
            font-size: 1rem;
            border: 2px solid #ced4da;
            border-radius: 25px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box:focus {
            border-color: #0088cc;
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 20px; 
            max-width: 1200px;
            margin: 0 auto;
        }
        .card { 
            background: white; 
            padding: 15px; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center; 
            position: relative;
        }
        .card img { 
            width: 100%;
            height: 300px;
            object-fit: cover; 
            border-radius: 6px; 
            background-color: #e9ecef;
        }
        .badge {
            position: absolute;
            top: 25px;
            right: 25px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            font-weight: bold;
        }
        h3 {
            font-size: 1rem;
            margin: 15px 0 10px 0;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 2.6em;
        }
        .btn { 
            margin-top: auto; 
            padding: 10px 15px; 
            background: #0088cc; 
            color: white; 
            text-decoration: none; 
            border-radius: 6px; 
            width: 100%;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .btn:hover { background: #0077b3; }
        .load-more-container {
            text-align: center;
            margin: 40px 0;
        }
        .load-btn {
            background: #212529;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
        }
        .load-btn:hover { background: #343a40; }
    </style>
</head>
<body>

    <header>
        <h1>Digital Library Catalog</h1>
        <input type="text" id="search" class="search-box" placeholder="Search by book title..." onkeyup="filterBooks()">
    </header>
    
    <div class="grid" id="book-container"></div>

    <div class="load-more-container">
        <button id="load-more-btn" class="load-btn" onclick="renderBatch()" style="display: none;">Load More Books</button>
    </div>

    <script>
        let allBooks = [];
        let filteredBooks = [];
        let currentIndex = 0;
        const BATCH_SIZE = 40;

        async function initCatalog() {
            try {
                const response = await fetch('catalog.json');
                allBooks = await response.json();
                filteredBooks = allBooks;
                renderBatch();
            } catch (error) {
                console.error("Error loading catalog:", error);
                document.getElementById('book-container').innerHTML = '<p>Error loading catalog.json</p>';
            }
        }

        function renderBatch() {
            const container = document.getElementById('book-container');
            const nextBatch = filteredBooks.slice(currentIndex, currentIndex + BATCH_SIZE);

            nextBatch.forEach(book => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const msg = `Hi! I would like to order: ${book.title} (ID: ${book.id})`;
                const telegramLink = `https://t.me/PBSA001?text=${encodeURIComponent(msg)}`;

                card.innerHTML = `
                    <span class="badge">${book.format || 'PDF'}</span>
                    <img src="covers/${book.cover_image}" alt="Cover" loading="lazy" onerror="this.src='https://via.placeholder.com/200x300?text=No+Cover'">
                    <h3>${book.title}</h3>
                    <a href="${telegramLink}" target="_blank" class="btn">Order via Telegram</a>
                `;
                container.appendChild(card);
            });

            currentIndex += BATCH_SIZE;
            
            const loadBtn = document.getElementById('load-more-btn');
            if (currentIndex < filteredBooks.length) {
                loadBtn.style.display = 'inline-block';
            } else {
                loadBtn.style.display = 'none';
            }
        }

        function filterBooks() {
            const query = document.getElementById('search').value.toLowerCase();
            filteredBooks = allBooks.filter(book => book.title.toLowerCase().includes(query));
            
            // Reset grid and rendering counter
            document.getElementById('book-container').innerHTML = '';
            currentIndex = 0;
            renderBatch();
        }

        initCatalog();
    </script>
</body>
</html>
