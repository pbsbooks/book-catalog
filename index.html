<script>
    const BOT_USERNAME = "Pinnah_Books_Order_Bot"; // ✅ Your actual bot username
    const TELEGRAM_CONTACT = "PBSA001";
    const BOOKS_PER_PAGE = 24;
    let allBooks = [], filteredBooks = [], categoryMap = {};
    let currentView = 'categories', selectedCategory = '', currentPage = 1, isAmharic = false, searchTimeout;

    function formatPages(value) {
        if (value === null || value === undefined || value === '') return 'N/A';
        const num = Number(value);
        if (!isNaN(num) && Number.isInteger(num)) return num.toString();
        if (!isNaN(num)) return Math.round(num).toString();
        return value.toString();
    }

    function buildBotLink(book) {
        const order = `Title: ${book.title}\nAuthor: ${book.author}\nID: ${book.id}\nCategory: ${book.category}\nFormat: ${book.format || 'N/A'}\nLanguage: ${book.language || 'N/A'}\nPages: ${formatPages(book.pages)}\nYear: ${book.year || 'N/A'}\nPrice: ${book.price || 'N/A'}`;
        const encoded = encodeURIComponent(order);
        return `https://t.me/${BOT_USERNAME}?start=${encoded}`;
    }

    async function initApp() {
        try {
            const response = await fetch('catalog.json');
            const rawData = await response.json();
            
            allBooks = rawData.map((b, index) => {
                const id = b.id || index + 1;
                
                // ✅ Fix for cover_image and coverImage keys
                let rawImg = b.cover_image || b.coverImage || b.image || b.Image || b.cover || b.Cover || b.i || `BK-${String(id).padStart(5, '0')}.webp`;
                let fullImagePath = rawImg.startsWith('covers/') ? rawImg : `covers/${rawImg}`;

                // ✅ Category fallbacks
                let cat = b.category || b.Category || b['Category Name'] || b.Category_Name || b.category_name || b.c || b.cat || b.genre || b.subject || 'General Archive';

                return {
                    id: id,
                    title: b.title || b.Title || b.t || b.name || `Book #${id}`,
                    author: b.author || b.Author || b.a || b.writer || 'Unknown Author',
                    category: cat,
                    image: fullImagePath,
                    description: b.description || b.Description || b.desc || b.Desc || b.summary || b.Summary || b.about || b.About || '',
                    language: b.language || b.Language || b.lang || b.Lang || 'N/A',
                    format: b.format || b.Format || b.type || b.Type || b.file_type || b.fileType || b.extension || b.ext || 'N/A',
                    pages: b.pages || b.Pages || b.page_count || b.pageCount || b.num_pages || b.numPages || 'N/A',
                    year: b.year || b.Year || b.publication_year || b.publicationYear || b.pub_year || b.pubYear || b.date || b.published || 'N/A',
                    price: b.price || b.Price || b.cost || b.Cost || b.sale_price || b.salePrice || b.price_ETB || b.priceETB || 'N/A'
                };
            });

            categoryMap = {};
            allBooks.forEach(book => { 
                const cat = book.category; 
                categoryMap[cat] = (categoryMap[cat] || 0) + 1; 
            });

            renderView();
        } catch (error) {
            document.getElementById('mainContent').innerHTML = `<div class="loader" style="color:#ef4444;"><i class="fa-solid fa-triangle-exclamation"></i> Failed to load <strong>catalog.json</strong>.</div>`;
        }
    }

    function renderView() { 
        currentView === 'categories' ? renderCategoriesView() : renderCatalogView(); 
    }

    function renderCategoriesView() {
        const container = document.getElementById('mainContent');
        let html = `
            <div class="section-header">
                <h2>${isAmharic ? 'የመጽሐፍ ምድቦች' : 'Browse Categories'}</h2>
                <span style="color:var(--text-muted); font-weight:600;">${Object.keys(categoryMap).length} ${isAmharic ? 'ምድቦች' : 'Categories Available'}</span>
            </div>
            <div class="category-grid">`;
            
        for (const [cat, count] of Object.entries(categoryMap)) {
            html += `
                <div class="category-card" data-category="${cat.replace(/"/g,'&quot;')}">
                    <div class="category-icon"><i class="fa-solid fa-book-open"></i></div>
                    <div class="category-name">${cat}</div>
                    <div class="category-count">${count.toLocaleString()} ${isAmharic ? 'መጻሕፍት' : 'Books'}</div>
                </div>`;
        }
        html += `</div>`;
        container.innerHTML = html;
        document.querySelectorAll('.category-card').forEach(card => card.addEventListener('click', () => selectCategory(card.getAttribute('data-category'))));
    }

    function renderCatalogView() {
        const container = document.getElementById('mainContent');
        const totalPages = Math.ceil(filteredBooks.length / BOOKS_PER_PAGE);
        const start = (currentPage - 1) * BOOKS_PER_PAGE;
        const booksToShow = filteredBooks.slice(start, start + BOOKS_PER_PAGE);
        
        let html = `
            <div class="section-header">
                <button class="back-btn" onclick="goHome()">
                    <i class="fa-solid fa-arrow-left"></i> ${isAmharic ? 'ወደ ምድቦች ተመለስ' : 'Back to Categories'}
                </button>
                <div>
                    <strong id="resultCount">${filteredBooks.length.toLocaleString()}</strong> 
                    <span data-en="Books Found" data-am="መጻሕፍት ተገኝተዋል">Books Found</span>
                    ${selectedCategory ? ` <span style="color:var(--text-muted);">(${selectedCategory})</span>` : ''}
                </div>
            </div>`;
            
        if (filteredBooks.length === 0) { 
            html += `<div class="loader">${isAmharic ? 'ለፍለጋዎ የሚስማማ መጽሐፍ አልተገኘም።' : 'No books found matching your search.'}</div>`; 
            container.innerHTML = html; 
            return; 
        }

        html += `<div class="book-grid">`;
        booksToShow.forEach(book => {
            const orderText = isAmharic ? 'ግዛ' : 'Buy Now';
            const safeImage = encodeURI(book.image);
            const botLink = buildBotLink(book);
            
            html += `
                <div class="book-card" data-id="${book.id}">
                    <div class="book-cover-container">
                        <img src="${safeImage}" alt="Cover" class="book-cover" loading="lazy" onerror="this.src='https://placehold.co/400x600/e2e8f0/64748b?text=No+Cover'">
                    </div>
                    <div class="book-category">${book.category}</div>
                    <h3 class="book-title" title="${book.title}">${book.title}</h3>
                    <div class="book-author">${isAmharic ? 'በ' : 'by'} ${book.author}</div>
                    <a href="${botLink}" target="_blank" class="btn-order" onclick="event.stopPropagation()">
                        <i class="fa-brands fa-telegram"></i> ${orderText}
                    </a>
                </div>`;
        });
        html += `</div>`;

        if (totalPages > 1) {
            html += `
                <div class="pagination">
                    <button class="btn-page" onclick="changePage(-1)" ${currentPage === 1 ? 'disabled' : ''}>
                        <i class="fa-solid fa-chevron-left"></i> ${isAmharic ? 'ቀደመ' : 'Prev'}
                    </button>
                    <span style="font-weight:600;">${currentPage} / ${totalPages}</span>
                    <button class="btn-page" onclick="changePage(1)" ${currentPage === totalPages ? 'disabled' : ''}>
                        ${isAmharic ? 'ቀጣይ' : 'Next'} <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>`;
        }
        
        container.innerHTML = html;
        
        document.querySelectorAll('.book-card').forEach(card => {
            card.addEventListener('click', () => { 
                const bookId = card.getAttribute('data-id'); 
                const book = filteredBooks.find(b => String(b.id) === String(bookId)); 
                if (book) openBookModal(book); 
            });
        });
    }

    function selectCategory(categoryName) { 
        selectedCategory = categoryName; 
        currentView = 'catalog'; 
        currentPage = 1; 
        filteredBooks = allBooks.filter(b => b.category === categoryName); 
        renderView(); 
        window.scrollTo({top: document.getElementById('mainContent').offsetTop - 100, behavior:'smooth'}); 
    }

    function goHome() { 
        currentView = 'categories'; 
        selectedCategory = ''; 
        document.getElementById('searchInput').value = ''; 
        renderView(); 
        window.scrollTo({top:0, behavior:'smooth'}); 
    }

    function handleSearch() { 
        clearTimeout(searchTimeout); 
        searchTimeout = setTimeout(() => { 
            const query = document.getElementById('searchInput').value.toLowerCase().trim(); 
            if (!query) { if (currentView === 'search') goHome(); return; } 
            currentView = 'search'; 
            currentPage = 1; 
            selectedCategory = 'Search Results'; 
            filteredBooks = allBooks.filter(b => 
                b.title.toLowerCase().includes(query) || 
                b.author.toLowerCase().includes(query) || 
                b.category.toLowerCase().includes(query)
            ); 
            renderView(); 
        }, 300); 
    }

    function changePage(delta) { 
        currentPage += delta; 
        renderView(); 
        window.scrollTo({top: document.getElementById('mainContent').offsetTop - 100, behavior:'smooth'}); 
    }

    function toggleLang() { 
        isAmharic = !isAmharic; 
        document.getElementById('langToggle').innerHTML = isAmharic ? '🌐 English' : '🌐 አማርኛ'; 
        document.querySelectorAll('[data-en]').forEach(el => el.innerText = isAmharic ? el.getAttribute('data-am') : el.getAttribute('data-en')); 
        document.getElementById('searchInput').placeholder = isAmharic ? 'የመጽሐፍ ስም ወይም ደራሲ ይፈልጉ...' : 'Search any book title or author...'; 
        renderView(); 
    }

    function openBookModal(book) {
        document.getElementById('modalCover').src = book.image;
        document.getElementById('modalTitle').innerText = book.title;
        document.getElementById('modalAuthor').innerText = (isAmharic ? 'በ' : 'by') + ' ' + book.author + ' · ' + book.category;
        
        const descEl = document.getElementById('modalDescription');
        if (book.description && book.description.trim() !== '') { 
            descEl.innerText = book.description; 
            descEl.style.display = 'block'; 
        } else { 
            descEl.innerText = ''; 
            descEl.style.display = 'none'; 
        }
        
        const metaItems = [
            { label: isAmharic ? 'ቋንቋ' : 'Language', value: book.language },
            { label: isAmharic ? 'ቅርጸት' : 'Format', value: book.format },
            { label: isAmharic ? 'ገጾች' : 'Pages', value: formatPages(book.pages) },
            { label: isAmharic ? 'ዓመት' : 'Year', value: book.year },
            { label: isAmharic ? 'ዋጋ' : 'Price', value: book.price }
        ];
        
        document.getElementById('modalMeta').innerHTML = metaItems.map(item => `
            <div class="meta-item">
                <div class="meta-label">${item.label}</div>
                <div class="meta-value">${item.value || 'N/A'}</div>
            </div>`).join('');
            
        document.getElementById('modalOrderBtn').href = buildBotLink(book);
        document.getElementById('bookModal').classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeBookModal() { 
        document.getElementById('bookModal').classList.remove('active'); 
        document.body.style.overflow = ''; 
    }

    function closeModalOnBackdrop(event) { 
        if (event.target === document.getElementById('bookModal')) closeBookModal(); 
    }

    window.onload = initApp;
</script>
