name: Generate SEO Files

on:
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Remove old books folder (if exists)
        run: |
          rm -rf books
          echo "books folder removed"

      - name: Run sitemap generator
        run: python generate_sitemap.py

      - name: Commit generated files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml books/ 2>/dev/null || true
          git add -u
          git commit -m "Remove static pages, update sitemap only" || echo "No changes to commit"
          git push origin HEAD:main
