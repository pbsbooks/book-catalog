name: Generate SEO Files

on:
  push:
    paths:
      - 'catalog.json'
      - 'generate_sitemap.py'
      - 'generate_static_pages.py'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run sitemap generator
        run: python generate_sitemap.py

      - name: Run static pages generator
        run: python generate_static_pages.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml books/
          git commit -m "Auto-generate SEO files" || echo "No changes to commit"
          git push
